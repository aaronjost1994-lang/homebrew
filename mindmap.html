<title>WinBrew Spec Mindmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Design plan
  Color: cool engineering-paper light theme / deep slate dark theme; copper accent;
  six branch hues (blue, amber, green, red, violet, teal) carried as tokens.
  Type: IBM Plex Sans for labels, IBM Plex Mono for subs, eyebrows and controls.
  Layout: full-viewport pan/zoom canvas; root in the middle, three branches
  per side, SVG bezier wires, fold on click, legend chips toggle branches.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #eff1f4;
    --surface: #ffffff;
    --ink: #1c2330;
    --muted: #5b6675;
    --line: #c9d0da;
    --accent: #b4541e;
    --b-files: #3565c4;
    --b-phases: #a87410;
    --b-dec: #2e7d43;
    --b-sec: #c23a3a;
    --b-rules: #7248c9;
    --b-patch: #0f8a8a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d;
      --surface: #1d222b;
      --ink: #e8ebf0;
      --muted: #97a1b0;
      --line: #333b48;
      --accent: #e07a3f;
      --b-files: #6f9bec;
      --b-phases: #d9a03f;
      --b-dec: #57b877;
      --b-sec: #e06c6c;
      --b-rules: #a184e8;
      --b-patch: #45bfbf;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171d;
    --surface: #1d222b;
    --ink: #e8ebf0;
    --muted: #97a1b0;
    --line: #333b48;
    --accent: #e07a3f;
    --b-files: #6f9bec;
    --b-phases: #d9a03f;
    --b-dec: #57b877;
    --b-sec: #e06c6c;
    --b-rules: #a184e8;
    --b-patch: #45bfbf;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, .node:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ── header ─────────────────────────────────────────── */
  header {
    flex: none;
    padding-block: 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  .head-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .ver {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 999px;
    padding: 1px 9px;
  }
  .controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .controls button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); }
  .legend {
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
    overflow-x: auto;
    margin-top: 9px;
    padding-bottom: 2px;
    min-width: 0;
    scrollbar-width: none;
  }
  .legend::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    color: var(--muted);
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .chip[aria-pressed="true"] {
    color: var(--ink);
    border-color: color-mix(in srgb, var(--c) 55%, var(--line));
    background: color-mix(in srgb, var(--c) 10%, var(--surface));
  }

  /* ── stage / canvas ─────────────────────────────────── */
  #app {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #stage {
    flex: 1 1 auto;
    min-height: 260px;
    position: relative;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #world.animated { transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1); }
  #wires { position: absolute; left: -2000px; top: -1500px; width: 4000px; height: 3000px; pointer-events: none; }

  .node {
    position: absolute;
    border-radius: 10px;
    padding: 8px 12px 9px;
    background: var(--surface);
    border: 1px solid var(--line);
    overflow-wrap: break-word;
  }
  .node .label {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--ink);
  }
  .node .sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--muted);
    margin-top: 3px;
  }
  .node .count {
    display: inline-block;
    margin-left: 7px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0 6px;
    vertical-align: 1px;
  }
  .node .count[hidden] { display: none; }
  .node[hidden] { display: none; }
  .node.foldable { cursor: pointer; }
  .node.foldable:hover { border-color: color-mix(in srgb, var(--c, var(--accent)) 60%, var(--line)); }

  .node.branch {
    background: color-mix(in srgb, var(--c) 12%, var(--surface));
    border-color: color-mix(in srgb, var(--c) 42%, var(--line));
    padding: 9px 13px 10px;
  }
  .node.branch .label { display: flex; align-items: center; gap: 8px; }
  .node.branch .label::before {
    content: "";
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--c);
    flex: none;
  }
  .node.leaf {
    background: color-mix(in srgb, var(--c) 7%, var(--surface));
    border-color: color-mix(in srgb, var(--c) 24%, var(--line));
    border-left: 3px solid color-mix(in srgb, var(--c) 62%, var(--surface));
  }
  .node.root {
    background: var(--ink);
    border-color: var(--accent);
    text-align: center;
    padding: 13px 18px 14px;
  }
  .node.root .label { color: var(--bg); font-size: 16px; }
  .node.root .sub { color: color-mix(in srgb, var(--bg) 72%, var(--ink)); }

  .hint {
    position: absolute;
    left: max(0px, env(safe-area-inset-left, 0px));
    bottom: max(0px, env(safe-area-inset-bottom, 0px));
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--muted);
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ── details panel ──────────────────────────────────── */
  #panel {
    position: absolute;
    top: 12px;
    right: 12px;
    bottom: 12px;
    width: min(320px, calc(100% - 24px));
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--pc, var(--accent));
    border-radius: 12px;
    padding: 14px 16px 16px;
    overflow-y: auto;
    box-shadow: 0 10px 28px color-mix(in srgb, var(--ink) 14%, transparent);
    z-index: 5;
  }
  #panel h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    padding-right: 28px;
  }
  #panel .psub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--muted);
    margin-top: 3px;
  }
  #panel ul {
    margin: 6px 0 0;
    padding: 0;
    list-style: none;
  }
  #panel li {
    position: relative;
    padding-left: 15px;
    margin-top: 9px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink);
  }
  #panel li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.55em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--pc, var(--accent));
  }
  #pclose {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    padding: 0;
    font-size: 15px;
    line-height: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }
  #pclose:hover { border-color: var(--accent); color: var(--ink); }
  .node.selected {
    outline: 2px solid color-mix(in srgb, var(--c, var(--accent)) 60%, transparent);
    outline-offset: 1px;
  }
  @media (max-width: 640px) {
    #panel {
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      max-height: 58%;
      border-radius: 14px 14px 0 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
    }
  }
</style>

<div id="app">
  <header>
    <div class="head-row">
      <span class="eyebrow">WinBrew · implementation prompts</span>
      <h1>Spec mindmap</h1>
      <span class="ver">v2.3.1</span>
      <div class="controls">
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="fit">Fit</button>
        <button id="foldall">Collapse</button>
        <button id="openall">Expand</button>
      </div>
    </div>
    <div class="legend" id="legend" role="group" aria-label="Branches"></div>
  </header>

  <div id="stage">
    <div id="world">
      <svg id="wires" viewBox="-2000 -1500 4000 3000" aria-hidden="true"></svg>
    </div>
    <div class="hint">drag to pan · scroll to zoom · click a card: fold or details · double-click fits</div>
    <aside id="panel" hidden aria-label="Node details">
      <button id="pclose" aria-label="Close details">×</button>
      <h3 id="ptitle"></h3>
      <div class="psub" id="psub"></div>
      <ul id="plist"></ul>
    </aside>
  </div>
</div>

<script>
"use strict";

/* ── data ─────────────────────────────────────────────── */
const BRANCHES = [
  { id: "files",  c: "--b-files",  side: -1, label: "Files & routing",
    sub: "what each session receives — and what it must never see",
    b: [
      "Four files, four audiences: every session reads PROMPT.md plus one phase file; CHANGES.md never leaves the owner's hands.",
      "RATIONALE.md ships only with Phase 0 and Phase F; CHANGES.md never ships (R14).",
    ],
    leaves: [
    { l: "PROMPT.md",            s: "part A design · part C templates → every session",
      b: [
        "Part A states the design to build; Part C holds the checkpoint templates (C1 phase report, C2 release readiness).",
        "Sent to every session — the only always-present context.",
      ]},
    { l: "phases/phase-0…f.md",  s: "one file per session",
      b: [
        "One file per session, shipped alone beside PROMPT.md; each session implements only its phase's scope.",
        "Run order: 0, A, B, C, D, E, F — E precedes F (D1 / R17).",
      ]},
    { l: "RATIONALE.md",         s: "sent with phase 0 & F only",
      b: [
        "Why each rule is what it is, and which alternatives were rejected (R1–R17).",
        "Sent only with Phase 0 and Phase F — implementation sessions never see it.",
      ]},
    { l: "CHANGES.md",           s: "owner only — never sent",
      b: [
        "Version history v2.0 → v2.3.1, including the nine v2.3.1 consistency fixes.",
        "Narrating old bugs risks models reproducing them, so it never ships (R14).",
      ]},
  ]},
  { id: "dec",    c: "--b-dec",    side: -1, label: "Locked decisions",
    sub: "eleven settled calls (D1–D11) — build them as stated",
    b: [
      "D1–D11 are the plan; contradicting evidence is reported to the owner, never designed around (A7).",
      "Each decision's rejected alternatives live in RATIONALE.md.",
    ],
    leaves: [
    { l: "D1 · Scope",           s: "v1.0 RC portable · v1.1 installers",
      b: [
        "v1.0 is a portable per-user RC (zip, no installers); v1.1 adds MSI/EXE and machine scope.",
        "Feature split, not build order — Phase F verifies v1.0 criteria and lists v1.1 separately (R17).",
      ]},
    { l: "D2 · Resolver",        s: "PubGrub, pure, catalog snapshot",
      b: [
        "PubGrub runs on an in-memory SQLite snapshot — no I/O during resolution (R2).",
        "Selected manifests must exactly match index entries, else exit 5 with no changes.",
      ]},
    { l: "D3 · Versions",        s: "NuGetVersion · interval ranges only",
      b: [
        "NuGetVersion semantics; ranges are intervals — no floating versions.",
        "'latest' disappeared from the index because it is arch- and prerelease-dependent.",
      ]},
    { l: "D4 · Shim",            s: "native AOT · argv[0] CRT rules · containment",
      b: [
        "bin\\ entries are copies of a shipped Native AOT shim template, not generated stubs (R3).",
        "argv[0] follows the MSVC CRT rules — no separator insertion (R5).",
        "Sidecars resolve inside packages\\; only wbrew.shim.json may target app\\ (R4).",
      ]},
    { l: "D5 · Mutation lock",   s: "processStartTime · no stale breaking",
      b: [
        "OS lock plus processStartTime defeats PID reuse; torn reads mean 'holder unknown' (R7).",
        "No stale-lock breaking: the kernel is the only liveness authority.",
      ]},
    { l: "D6 · Repo trust",      s: "simplified TUF · sparse index · SQLite catalog",
      b: [
        "Simplified TUF: ECDSA P-256, threshold signatures, high-water marks (R8).",
        "Cargo-style sparse index feeds a SQLite catalog — the resolver's only input.",
      ]},
    { l: "D7 · Mark-of-the-Web", s: "none — signatures instead",
      b: [
        "No Mark-of-the-Web / zone.identifier checks — signature verification replaces them.",
      ]},
    { l: "D8 · Uninstall",       s: "refuse with dependents · autoremove",
      b: [
        "Uninstall refuses while other installed packages still depend on the target.",
        "autoremove removes packages nothing depends on anymore.",

    { l: "D9 · Exit codes",      s: "13 InstallerBusy · 130 cancelled",
      b: [
        "13 InstallerBusy (msiexec 1618), 130 cancelled, 206 shim overflow (R16).",
        "One table in ExitCodes.cs; cli-reference.md documents it, including the 130-vs-0xC000013A note.",
      ]},
    { l: "D10 · Config",         s: "typed keys · testing.* rejected in release",
      b: [
        "Typed configuration keys; testing.* keys are rejected by release builds.",
      ]},
    { l: "D11 · Telemetry",      s: "none",
      b: [
        "None. No telemetry, no phone-home.",
      ]},

  { id: "patch",  c: "--b-patch",  side: -1, label: "v2.3.1 patch",
    sub: "the v2.3.1 review fixes that changed the map",
    b: [
      "v2.3.1 shipped nine consistency fixes (see CHANGES.md); the six below changed behavior, assignments or syntax.",
      "All nine are already folded into PROMPT.md and the phase files.",
    ],
    leaves: [
    { l: "E precedes F",         s: "first release covers v1.0 + lists v1.1",
      b: [
        "Order stays 0, A–D, E, F: F's release surface is built once, after E's fixtures and helper exist (R17).",
        "A portable-only v1.0 can be cut by tagging the tree after Phase D.",
      ]},
    { l: "self uninstall → D",   s: "installer refusal completes in E",
      b: [
        "Refuses while installer-managed packages remain installed (A14); Phase E completes the refusal.",
      ]},
    { l: "catalog info → D",     s: "writesToInstallDir warning",
      b: [
        "info warns when a package writes state inside its install directory — it won't survive upgrades (A9).",
      ]},
    { l: "bundle --lock",        s: "--locked flag · <bundle>.lock.json",
      b: [
        "bundle install --file <path> --lock <path> [--locked]; default lockfile <bundle>.lock.json (A15).",
      ]},
    { l: "Helper requests",      s: "sole arg · untrusted request file",
      b: [
        "The elevated helper takes exactly one argument — an untrusted request file (A12).",
      ]},
    { l: "Phase 0 additions",    s: "SCL 2.0 stable probe · per-project TFMs",
      b: [
        "Probe System.CommandLine 2.0 stability (default decision 9); per-project TFMs join the deliverables (R15).",
      ]},
  ]},
  { id: "phases", c: "--b-phases", side: 1, label: "Phases 0→F",
    sub: "seven ordered sessions, each ending in a checkpoint",
    b: [
      "One phase per session; A and B split into src and tests sub-sessions by default.",
      "A phase counts as complete only after its test sub-session passes and the checkpoint says COMPLETE.",
    ],
    leaves: [
    { l: "Phase 0 · Plan",       s: "defaults · probes · SQLite schema v1",

    { l: "Phase A · CLI & state", s: "config · schemas · lock · doctor",
      b: [
        "Command surface, config, schemas, mutation lock, doctor.",
      ]},
    { l: "Phase B · Lifecycle",  s: "HTTP · archives · shim · journal · self install",
      b: [
        "HTTP client, archive extraction, shim install, journal — self install end to end.",
      ]},
    { l: "Phase C · Resolver",   s: "PubGrub · arch selection · upgrade recovery",
      b: [
        "PubGrub resolver, architecture selection, upgrade recovery.",
      ]},
    { l: "Phase D · Trust",      s: "TUF · sparse catalog · repo · self update/uninstall",
      b: [
        "TUF verification, sparse catalog, repo management, self update / uninstall.",
      ]},
    { l: "Phase E · Installers", s: "MSI · EXE · elevated helper (v1.1)",
      b: [
        "MSI and EXE models, elevated helper, fixture installers in CI (v1.1).",
      ]},
    { l: "Phase F · Release",    s: "docs · CI · SBOM · readiness report",
      b: [
        "Docs, ci/release workflows, SBOM, signing, readiness report (C2).",
      ]},
  ]},
  { id: "sec",    c: "--b-sec",    side: 1, label: "Security pillars",
    sub: "test-enforced guarantees, not documentation",
    b: [
      "Every pillar lands in a phase acceptance list with a concrete test or evidence artifact.",
      "Where a test cannot prove a claim, the readiness report says so explicitly.",
    ],
    leaves: [
    { l: "Elevated helper",      s: "refuse, never adopt (A12)",
      b: [
        "Refuse, never adopt: owner + DACL checks on opened handles; ERROR_ALREADY_EXISTS re-checks (R6).",
        "No ACL outside helper-created directories is ever changed — proven by before/after snapshots.",
      ]},
    { l: "Network",              s: "HTTPS-only · manual redirects · per-origin creds",
      b: [
        "HTTPS-only, manual redirects, per-origin credentials; the localhost exception stays compiled out (R12).",
      ]},
    { l: "Archives",             s: "every A13 defense · streaming limits",
      b: [
        "Every A13 defense, enforced while streaming: entry names, traversal, ratios, size caps — one test per defense (A13, Phase B).",
      ]},
    { l: "Signatures",           s: "ECDSA P-256 · SPKI pre-parse · thresholds",
      b: [
        "ECDSA P-256 P1363, exact-payload envelopes, SPKI pre-parsed via Asn1, 64-byte rule, thresholds (R8).",
      ]},
    { l: "Test hooks",           s: "compiled out of release (-p:WinBrewTestHooks)",
      b: [
        "Fault injection lives behind -p:WinBrewTestHooks; a reflection test proves release builds lack it (R9).",
      ]},
    { l: "No %TEMP% extraction", s: "asserted by test (A4 / A17)",
      b: [
        "Native DLLs ship side-by-side; a test asserts nothing is ever extracted (A4 / A17, R1).",
      ]},
  ]},
  { id: "rules",  c: "--b-rules",  side: 1, label: "Session rules",
    sub: "how every session must run and report",
    b: [
      "These bind every phase session, from PROMPT.md Part A and the context-management rules.",
    ],
    leaves: [
    { l: "One phase per session", s: "in order: 0 A B C D E F",
      b: [
        "Strict order 0, A, B, C, D, E, F — no skipping (D1).",
      ]},
    { l: "Session inputs",       s: "PROMPT.md + one phase file + last checkpoint",
      b: [

      ]},
    { l: "src → tests split",    s: "default for phases A & B",
      b: [

      ]},
    { l: "Honesty rules (A2)",   s: "never fabricate builds, tests, checksums",
      b: [

    { l: "Checkpoints (C1/C2)",  s: "INCOMPLETE mid-phase · COMPLETE after tests",

/* ── dom setup ────────────────────────────────────────── */
const stage = document.getElementById("stage");
const world = document.getElementById("world");
const wires = document.getElementById("wires");
const legend = document.getElementById("legend");

const nodes = [];
function makeNode(kind, label, sub, cvar, parentId) {
  const n = { id: nodes.length, kind, label, sub, cvar, parentId, children: [],
              cx: 0, cy: 0, w: 0, h: 0, el: document.createElement("div") };
  n.el.className = "node " + kind;
  if (cvar) n.el.style.setProperty("--c", "var(" + cvar + ")");
  const lab = document.createElement("div");
  lab.className = "label";
  lab.textContent = label;
  n.el.appendChild(lab);
  n.labEl = lab;
  if (sub) {
    const s = document.createElement("div");
    s.className = "sub";
    s.textContent = sub;
    n.el.appendChild(s);
  }
  world.appendChild(n.el);
  nodes.push(n);
  return n;
}

const root = makeNode("root", "WinBrew", "implementation prompt · v2.3.1", null, null);
root.bullets = [
  "Interactive map of the WinBrew implementation prompt set (v2.3.1) — click any card for what it means.",
  "Every session gets PROMPT.md + one phase file + the previous checkpoint — nothing else.",
  "The design is locked (A§ / D§): build what it says and report contradictions, never deviations.",
];

const folded = new Set();
for (const b of BRANCHES) {
  const bn = makeNode("branch", b.label, b.sub || null, b.c, root.id);
  bn.key = b.id; bn.side = b.side; bn.bullets = b.b || [];
  root.children.push(bn);
  for (const leaf of b.leaves) {
    const ln = makeNode("leaf", leaf.l, leaf.s, b.c, bn.id);
    ln.bullets = leaf.b || [];
    bn.children.push(ln);
  }
  const chip = document.createElement("button");
  chip.className = "chip";
  chip.style.setProperty("--c", "var(" + b.c + ")");
  chip.setAttribute("aria-pressed", "true");
  const dot = document.createElement("span");
  dot.className = "dot";
  chip.appendChild(dot);
  chip.appendChild(document.createTextNode(b.label));
  chip.addEventListener("click", () => {
    folded.has(bn.id) ? folded.delete(bn.id) : folded.add(bn.id);
    chip.setAttribute("aria-pressed", String(!folded.has(bn.id)));
    render();
    fit(true);
  });
  legend.appendChild(chip);
}
nodes.forEach(n => {
  if (n.children.length) { n.el.classList.add("foldable"); n.el.title = "click: fold / unfold · details"; }
});
const branchNodes = nodes.filter(n => n.kind === "branch");

/* ── measure ──────────────────────────────────────────── */
const WIDTHS = { root: 205, branch: 235, leaf: 252 };
function measure() {
  for (const n of nodes) {
    n.el.style.width = WIDTHS[n.kind] + "px";
    n.w = WIDTHS[n.kind];
    const h = n.el.offsetHeight;
    if (h > 0) n.h = h;   // hidden nodes report 0 — keep the real height
  }
}

/* ── layout ───────────────────────────────────────────── */
const GX = 52, GY = 14, GY1 = 40;
function visible(n) {
  for (let p = nodes[n.parentId]; p; p = nodes[p.parentId]) if (folded.has(p.id)) return false;
  return true;
}
function subtreeH(n) {
  if (folded.has(n.id) || !n.children.length) return n.h;
  let t = 0;
  for (const c of n.children) t += subtreeH(c);
  return Math.max(n.h, t + GY * (n.children.length - 1));
}
function placeY(n, center) {
  n.cy = center;
  if (folded.has(n.id) || !n.children.length) return;
  const total = n.children.reduce((a, c) => a + subtreeH(c), 0) + GY * (n.children.length - 1);
  let top = center - total / 2;
  for (const c of n.children) {
    placeY(c, top + subtreeH(c) / 2);
    top += subtreeH(c) + GY;
  }
}
function layout() {
  root.cx = 0; root.cy = 0;
  for (const side of [-1, 1]) {
    const roots = branchNodes.filter(b => b.side === side);
    const heights = roots.map(subtreeH);
    const total = heights.reduce((a, h) => a + h, 0) + GY1 * (roots.length - 1);
    let cursor = -total / 2;
    roots.forEach((b, i) => {
      b.cx = side * (root.w / 2 + GX + b.w / 2);
      placeY(b, cursor + heights[i] / 2);
      cursor += heights[i] + GY1;
      if (!folded.has(b.id)) {
        let top = b.cy - (b.children.reduce((a, c) => a + subtreeH(c), 0) + GY * (b.children.length - 1)) / 2;
        for (const c of b.children) {
          c.cx = b.cx + side * (b.w / 2 + GX + c.w / 2);
          c.cy = top + subtreeH(c) / 2;
          top += subtreeH(c) + GY;
        }
      }
    });
  }
}

/* ── draw ─────────────────────────────────────────────── */
function render() {
  layout();
  const box = { minX: 1e9, minY: 1e9, maxX: -1e9, maxY: -1e9, any: false };
  let out = "";
  for (const n of nodes) {
    const vis = visible(n);
    n.el.hidden = !vis;
    n.el.style.left = (n.cx - n.w / 2) + "px";
    n.el.style.top = (n.cy - n.h / 2) + "px";
    if (n.children.length && n.kind !== "root") {   // root never folds — no badge
      const cnt = (function count(m) {
        let t = 0;
        for (const c of m.children) t += 1 + count(c);
        return t;
      })(n);
      const badge = n.labEl.querySelector(".count") ||
        (() => { const s = document.createElement("span"); s.className = "count"; n.labEl.appendChild(s); return s; })();
      if (folded.has(n.id)) { badge.textContent = cnt; badge.hidden = false; }
      else badge.hidden = true;
    }
    if (vis) {
      box.any = true;
      box.minX = Math.min(box.minX, n.cx - n.w / 2); box.maxX = Math.max(box.maxX, n.cx + n.w / 2);
      box.minY = Math.min(box.minY, n.cy - n.h / 2); box.maxY = Math.max(box.maxY, n.cy + n.h / 2);
    }
  }
  for (const n of nodes) {
    if (!visible(n) || folded.has(n.id) || !n.children.length) continue;
    for (const c of n.children) {
      if (!visible(c)) continue;
      const dir = Math.sign(c.cx - n.cx) || 1;
      const x1 = n.cx + dir * n.w / 2, y1 = n.cy;
      const x2 = c.cx - dir * c.w / 2, y2 = c.cy;
      const mx = (x1 + x2) / 2;
      const col = c.cvar ? "color-mix(in srgb, var(" + c.cvar + ") 55%, var(--line))" : "var(--line)";
      out += '<path d="M' + x1.toFixed(1) + " " + y1.toFixed(1) +
             " C" + mx.toFixed(1) + " " + y1.toFixed(1) + " " + mx.toFixed(1) + " " + y2.toFixed(1) +
             " " + x2.toFixed(1) + " " + y2.toFixed(1) +
             '" fill="none" style="stroke:' + col + ';stroke-width:1.5;stroke-linecap:round"/>';
    }
  }
  wires.innerHTML = out;
  return box;
}

/* ── view ─────────────────────────────────────────────── */
let tx = 0, ty = 0, sc = 1;
function glide(on) {
  if (on) world.classList.add("animated"); else world.classList.remove("animated");
  apply();
}
function apply() { world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")"; }
function clampS(v) { return Math.min(1.6, Math.max(0.22, v)); }
function fit(animate) {
  if (!render.box || !render.box.any) return;
  const box = render.box;
  const vw = stage.clientWidth, vh = stage.clientHeight;
  sc = clampS(Math.min((vw - 48) / (box.maxX - box.minX), (vh - 48) / (box.maxY - box.minY), 1.15));
  tx = vw / 2 - sc * (box.minX + box.maxX) / 2;
  ty = vh / 2 - sc * (box.minY + box.maxY) / 2;
  glide(animate);
}
function zoomAt(f, mx, my, animate) {
  const s2 = clampS(sc * f);
  tx = mx - (mx - tx) * (s2 / sc);
  ty = my - (my - ty) * (s2 / sc);
  sc = s2;
  glide(animate);
}

/* render stores bbox for fit */
const _render = render;
render = function () { render.box = _render(); };

/* ── interaction ──────────────────────────────────────── */
let drag = null;
stage.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false, node: e.target.closest(".node") };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; stage.classList.add("dragging"); }
  if (drag.moved) { tx = drag.tx + dx; ty = drag.ty + dy; glide(false); }
});
function activate(n) {
  if (n.children.length && n.kind !== "root") {
    folded.has(n.id) ? folded.delete(n.id) : folded.add(n.id);
    render();
    fit(true);
  }
  showPanel(n);
}
stage.addEventListener("pointerup", e => {
  if (drag && !drag.moved) {
    if (drag.node) {
      const id = +drag.node.getAttribute("data-id");
      if (id >= 0 && nodes[id]) activate(nodes[id]);
    } else closePanel();   // a click on empty canvas puts the panel away
  }
  stage.classList.remove("dragging");
  drag = null;
});
stage.addEventListener("pointercancel", () => { drag = null; stage.classList.remove("dragging"); });
stage.addEventListener("dblclick", e => { if (!e.target.closest(".node")) fit(true); });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0016), e.clientX - r.left, e.clientY - r.top, false);
}, { passive: false });

document.getElementById("zin").addEventListener("click", () => zoomAt(1.25, stage.clientWidth / 2, stage.clientHeight / 2, true));
document.getElementById("zout").addEventListener("click", () => zoomAt(0.8, stage.clientWidth / 2, stage.clientHeight / 2, true));
document.getElementById("fit").addEventListener("click", () => fit(true));
document.getElementById("openall").addEventListener("click", () => { folded.clear(); syncChips(); render(); fit(true); });
document.getElementById("foldall").addEventListener("click", () => { branchNodes.forEach(b => folded.add(b.id)); syncChips(); render(); fit(true); });
function syncChips() {
  legend.querySelectorAll(".chip").forEach((ch, i) => {
    ch.setAttribute("aria-pressed", String(!folded.has(branchNodes[i].id)));
  });
}

/* ── details panel ─────────────────────────────────────── */
const panelEl = document.getElementById("panel");
const ptitle = document.getElementById("ptitle");
const psub = document.getElementById("psub");
const plist = document.getElementById("plist");
let selected = null;
function showPanel(n) {
  if (selected) selected.el.classList.remove("selected");
  selected = n;
  n.el.classList.add("selected");
  panelEl.style.setProperty("--pc", n.cvar ? "var(" + n.cvar + ")" : "var(--accent)");
  ptitle.textContent = n.label;
  psub.textContent = n.sub || "";
  psub.hidden = !n.sub;
  plist.innerHTML = "";
  for (const t of n.bullets || []) {
    const li = document.createElement("li");
    li.textContent = t;
    plist.appendChild(li);
  }
  panelEl.hidden = false;
  panelEl.scrollTop = 0;
}
function closePanel() {
  panelEl.hidden = true;
  if (selected) { selected.el.classList.remove("selected"); selected = null; }
}
document.getElementById("pclose").addEventListener("click", closePanel);
window.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

/* give each node its index for click lookup; make it keyboard-operable */
nodes.forEach((n, i) => {
  n.el.setAttribute("data-id", String(i));
  n.el.tabIndex = 0;
  n.el.setAttribute("role", "button");
  n.el.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    activate(n);
  });
});

/* ── boot ─────────────────────────────────────────────── */
measure();
branchNodes.forEach(b => folded.add(b.id));   // start readable: root + 6 branches
syncChips();
render();
fit(true);

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { measure(); render(); fit(); });
}
window.addEventListener("resize", fit);
</script>
