# WinBrew CI (A18). Locked restore for every published RID, build (warnings are
# errors, analyzers on), unit + integration tests in the release AND the
# test-hooks build, publish + package both architectures, and run the
# release-binary checks (zip contents vs scripts/publish-files.txt,
# SHA256SUMS.txt, no %TEMP% extraction, self install, A17 timings) on the
# NATIVE runner of each architecture.
#
# Action versions are pinned by tag; pin them by commit SHA before the first
# public release (release-checklist.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm   # GitHub-hosted Windows ARM64 label; verify it is still current
    runs-on: ${{ matrix.runner }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Locked restore (validates every published RID's lock section)
        # WinBrew.Cli, WinBrew.Shim and WinBrew.ElevatedHelper declare
        # RuntimeIdentifiers=win-x64;win-arm64, so ONE solution-level locked
        # restore checks both RID graphs. Per-RID `-r --locked-mode` restores
        # are not expressible (NU1004 on the RID-less libraries, ADR-0002);
        # publishing then runs with --no-restore.
        run: dotnet restore WinBrew.sln --locked-mode

      - name: Build (release)
        run: dotnet build WinBrew.sln -c Release --no-restore

      - name: Test (release build)
        run: dotnet test WinBrew.sln -c Release --no-build --logger "trx;LogFilePrefix=release" --results-directory TestResults

      - name: Build installer fixtures (WiX MSI + fixture EXE)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          pwsh scripts/build-installer-fixtures.ps1 -Output "$env:RUNNER_TEMP/installer-fixtures"
          "WINBREW_INSTALLER_FIXTURES=$env:RUNNER_TEMP/installer-fixtures" >> $env:GITHUB_ENV
          "WINBREW_DISPOSABLE_RUNNER=1" >> $env:GITHUB_ENV

      - name: Build + test (test-hooks build; crash/fault-injection matrix)
        shell: pwsh
        run: |
          dotnet build WinBrew.sln -c Release --no-restore -p:WinBrewTestHooks=true
          if ($LASTEXITCODE -ne 0) { throw 'test-hooks build failed' }
          dotnet test WinBrew.sln -c Release --no-build --logger "trx;LogFilePrefix=testhooks" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw 'test-hooks tests failed' }

      - name: Lock files unchanged (no build or test step may rewrite them)
        run: git diff --exit-code -- '**/packages.lock.json'

      - name: Publish + package (this architecture)
        shell: pwsh
        run: pwsh scripts/package-release.ps1 -Version 0.0.0-ci -Output out -Rids ${{ matrix.rid }}

      - name: Shim + published-binary integration tests (real Native AOT shim)
        # D4 shim behavior (quoting, exit-code forwarding, containment, 9009/206)
        # and the no-%TEMP%-extraction check need the PUBLISHED binaries, which
        # exist only after packaging; earlier test steps skip them. Runs the
        # test-hooks build from the step above (--no-build). A run in which these
        # tests are all skipped fails here instead of passing silently.
        shell: pwsh
        run: |
          $env:WINBREW_SHIM_EXE = (Resolve-Path "out/${{ matrix.rid }}/wbrew-shim.exe").Path
          $env:WINBREW_PUBLISHED_EXE = (Resolve-Path "out/${{ matrix.rid }}/wbrew.exe").Path
          dotnet test tests/WinBrew.IntegrationTests -c Release --no-build `
            --filter "FullyQualifiedName~ShimProcessTests|FullyQualifiedName~ExtractionVerificationTests" `
            --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=artifacts" --results-directory TestResults | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { throw 'artifact-backed integration tests failed' }
          if (($output -join "`n") -notmatch 'Passed:\s+[1-9]') { throw 'no artifact-backed integration test ran' }
          if (($output -join "`n") -match 'Skipped:\s+[1-9]') { throw 'artifact-backed integration tests were skipped' }

      - name: Release-binary checks (E2E project, published binaries)
        shell: pwsh
        run: |
          $env:WINBREW_RELEASE_ZIP = (Resolve-Path "out/wbrew-0.0.0-ci-${{ matrix.rid }}.zip").Path
          $env:WINBREW_RELEASE_DIR = (Resolve-Path out).Path
          dotnet test tests/WinBrew.EndToEndTests -c Release --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=e2e" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults

      - uses: actions/upload-artifact@v4
        with:
          name: wbrew-${{ matrix.rid }}-unsigned
          path: |
            out/*.zip
            out/SHA256SUMS.txt

  linux:
    name: linux (dev-host parity, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build --target test
        run: docker build --target test -t winbrew-test .
