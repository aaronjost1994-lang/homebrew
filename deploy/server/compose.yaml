# WinBrew repository server: a signed demo repository served over HTTPS.
#
#   cp .env.example .env        # set PUBLIC_HOST (and ports) first
#   docker compose up -d --build
#   docker compose logs repo-builder          # shows the root fingerprint
#
# Full walkthrough (server and Windows client): ../README.md

name: winbrew-repo

services:
  repo-builder:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    environment:
      # The URL clients use. It is written into every manifest, so it must
      # match how Windows machines reach Caddy (host name or IP + port).
      WINBREW_REPO_BASE_URL: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:${HTTPS_PORT:-8443}/
      WINBREW_REPO_EVERY_HOURS: ${RESIGN_EVERY_HOURS:-24}
    volumes:
      - keys:/keys            # signing keys + root.1.json: back this up, never serve it
      - repo:/srv/repo        # the published repository
      # Publish your own packages instead of the demo ones:
      # - ./my-packages:/packages:ro
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    depends_on:
      - repo-builder
    environment:
      SITE_ADDRESS: https://${PUBLIC_HOST}:${HTTPS_PORT:-8443}
    ports:
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
      - "${HTTP_PORT:-8080}:80"   # only needed for Let's Encrypt (set HTTP_PORT=80)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - repo:/srv/repo:ro
      - caddy-data:/data      # certificates, including Caddy's local CA
      - caddy-config:/config
    restart: unless-stopped

volumes:
  keys:
  repo:
  caddy-data:
  caddy-config:
